  CMD_NO_POWER: "§c[Legend] You don't have an assigned class."
  ROLE_DESC_ASSASSIN: "§8§m-----------§d The Assassin §8§m-----------\n§dAbilities:\n§f• Secret Blade (Iron Sharpness I)\n§f• +%extra_hearts% extra hearts\n§f• Strength I with Secret Blade + < 2 swords\n§8§m-----------------------------------------"
  ROLE_DESC_MAGE: "§8§m-----------§d The Mage §8§m-----------\n§dAbilities:\n§f• 3 splash potions at start\n§f• Regenerates 3 potions / 10 minutes\n§f• (Strength, Resistance, Speed)\n§8§m--------------------------------------"
  ROLE_DESC_ARCHER: "§8§m-----------§d The Archer §8§m-----------\n§dAbilities:\n§f• Bow Power II Infinity I\n§f• Increased bow damage\n§f• 25% Slowness chance on arrow\n§8§m---------------------------------------"
  ROLE_DESC_TANK: "§8§m-----------§d The Tank §8§m-----------\n§dAbilities:\n§f• +%extra_hearts% extra hearts\n§f• Resistance I when low health\n§8§m--------------------------------------"
  ROLE_DESC_NAIN: "§8§m-----------§d The Dwarf §8§m-----------\n§dAbilities:\n§f• Active: Diamond armor Prot II (30s)\n§f• Cooldown: 10 minutes\n§f• Permanent Haste I\n§8§m--------------------------------------"
  ROLE_DESC_ZEUS: "§8§m-----------§d Zeus §8§m-----------\n§dAbilities:\n§f• 10% lightning on melee hit\n§f• 20% Speed I 10s on melee hit\n§f• Active: 2 random effects (10min cd)\n§8§m-----------------------------------"
  ROLE_DESC_NECROMANCIEN: "§8§m-------§d The Necromancer §8§m-------\n§dAbilities:\n§f• Active: 2 skeletons + 3 baby zombies\n§f• Target nearest enemy (10min cd)\n§f• Permanent Night Vision\n§8§m-----------------------------------------"
  ROLE_DESC_SUCCUBE: "§8§m-----------§d The Succubus §8§m-----------\n§dAbilities:\n§f• Lifesteal on melee hit (+1 ♥)\n§f• Active: Absorption III to team (6min cd)\n§8§m-------------------------------------------"
  ROLE_DESC_SOLDAT: "§8§m-----------§d The Soldier §8§m-----------\n§dAbilities:\n§f• Permanent Resistance I\n§f• Bonus sword damage (melee)\n§f• Full iron Prot I equipment\n§8§m----------------------------------------"
  ROLE_DESC_PRINCESSE: "§8§m-----------§d The Princess §8§m-----------\n§dAbilities:\n§f• Fall damage immunity\n§f• +%extra_hearts% extra hearts\n§f• Permanent Speed I\n§8§m------------------------------------------"
  ROLE_DESC_CAVALIER: "§8§m-----------§d The Knight §8§m-----------\n§dAbilities:\n§f• Active: Royal Horse (5min cd)\n§f• Royal Lance (Diamond Sharp I)\n§8§m---------------------------------------"
  ROLE_DESC_OGRE: "§8§m-----------§d The Ogre §8§m-----------\n§dAbilities:\n§f• +%extra_hearts% extra hearts\n§f• %start_gapples% gapples at start\n§f• Debuff if < 5 gapples (Slow + Weakness)\n§f• Random effect when eating a gapple\n§8§m---------------------------------------"
  ROLE_DESC_DRAGON: "§8§m-----------§d The Dragon §8§m-----------\n§dAbilities:\n§f• Permanent Fire Resistance\n§f• 30% ignite on melee hit\n§f• Active: Fireball (5min cd)\n§f• +%extra_hearts% extra hearts\n§8§m----------------------------------------"
  ROLE_DESC_MEDECIN: "§8§m-----------§d The Medic §8§m-----------\n§dAbilities:\n§f• Regen I zone (6 blocks) for allies\n§f• 5 gapples at start\n§f• Permanent Regeneration I\n§8§m--------------------------------------"
  ROLE_DESC_PRISONNIER: "§8§m-----------§d The Prisoner §8§m-----------\n§dAbilities:\n§f• Permanent Speed I\n§f• Active: Chain nearest enemy\n§f• (Slowness II + Weakness I, 5min cd)\n§8§m------------------------------------------"
  ROLE_DESC_CORNE: "§8§m-----------§d The Horn §8§m-----------\n§dAbilities:\n§f• Permanent Weakness I (debuff)\n§f• 4 Melodies (team buff 30 blocks):\n§e  ♪ Fire: Fire Res II 12s (1min cd)\n§a  ♪ Heal: Full heal (10min cd)\n§9  ♪ Metal: Resist II 5s (1min cd)\n§b  ♪ Air: Speed II 8s (3min cd)\n§8§m--------------------------------------"
  ROLE_DESC_MARIONNETTISTE: "§8§m-------§d The Puppeteer §8§m-------\n§dAbilities:\n§f• Kill = victim becomes puppet\n§f• Joins your team (random type):\n§c  → Fierce (Strength I)\n§9  → Massive (Resistance I)\n§b  → Shy (Speed I)\n§f• Poison if > 16 blocks away\n§f• Puppets die if you die\n§8§m--------------------------------------"
  ROLE_DESC_PALADIN: "§8§m-----------§d The Paladin §8§m-----------\n§dAbilities:\n§f• +%extra_hearts% extra hearts\n§f• Resistance I when low health\n§f• Strength I when ally nearby (8 blocks)\n§f• Active: Blessing (8min cd)\n§f• Sacred Sword (Gold Sharp II)\n§8§m------------------------------------------"
mysteryteam:
  FIND_TEAMMATES: "§6⚔ §eFind your teammates! Size: §6%team_size%"
nuzlocke:
  TYPE_ASSIGNED: "§6§l⚡ Nuzlocke §r§eYour type is: %nuzlocke_color%§l%nuzlocke_name%"
  SCENARIO_DESC: "§eEach player gets a random Pokémon type at game start. Each type brings strengths, weaknesses and unique abilities."
  ROLE_DESC_NORMAL: "§8§m-----------§f Normal §8§m-----------\n§fStrengths:\n§f• §a/substitute §f: TP 20 block random + full iron Zombie at your spot (5min cd)\n§f• Gapple heals 2.5 hearts instead of 2\n§f• Permanent Resistance 1\n§fWeaknesses:\n§f• None\n§fEnv:\n§f• No nerf\n§8§m-----------------------------------"
  ROLE_DESC_GRASS: "§8§m-----------§a Grass §8§m-----------\n§aStrengths:\n§f• Speed I on grass and leaves\n§f• §a/nearme §f: players within 100 blocks (5min cd)\n§f• Apples drop from logs and 5% from leaves\n§aWeaknesses:\n§f• Arrows received +10% damage\n§f• Must hydrate every 5min (else Slowness II)\n§f• Fire damage doubled\n§8§m-----------------------------------"
  ROLE_DESC_WATER: "§8§m-----------§9 Water §8§m-----------\n§9Strengths:\n§f• Infinite water breathing + Depth Strider II\n§f• Stops burning when out of fire\n§f• Muddy Water: arrow in water → 50% slip effect 45s (arrows slower + reduced range)\n§9Power:\n§f• §bSponge §f: wall of water that pushes nearby players (5min cd)\n§9Weaknesses:\n§f• Slowness I near lava\n§f• Mining Fatigue on grass and leaves\n§8§m-----------------------------------"
  ROLE_DESC_ROCK: "§8§m-----------§7 Rock §8§m-----------\n§7Strengths:\n§f• Permanent Haste IV\n§f• Permanent Resistance I\n§f• Sturdy: 2 absorption hearts regen every 2 min\n§7Weaknesses:\n§f• Fall damage doubled\n§f• Slowness I\n§7Env:\n§f• At 5 stacks of cobble: smelt to stone + pickaxe repaired + Eff III + Unb III + Silk Touch\n§8§m-----------------------------------"
  ROLE_DESC_DARK: "§8§m-----------§8 Dark §8§m-----------\n§8Strengths:\n§f• Permanent Night Vision\n§f• Arrows give Blindness 1s\n§f• Speed I + 15% melee damage at night or out of sunlight\n§8Command:\n§f• §a/sound <player> <key> §f: play sound at night (1min cd)\n§8Weaknesses:\n§f• Weakness I + Slowness I when exposed to sunlight\n§8§m-----------------------------------"
  ROLE_DESC_ELECTRIC: "§8§m-----------§e Electric §8§m-----------\n§eStrengths:\n§f• Permanent Speed 2\n§f• Paralysis 20% on arrow (Slowness 6 + Jump 200 2s)\n§f• Motor Drive (toggle): arrows 75% faster\n§eWeaknesses:\n§f• +10% damage taken\n§f• Mining Fatigue near bedrock/obsidian\n§eEnv:\n§f• In rain (50 blocks): charged creepers, pigs→zombie pigmen, creeper immune\n§8§m-----------------------------------"
  ROLE_DESC_STEEL: "§8§m-----------§7 Steel §8§m-----------\n§7Strengths:\n§f• Permanent Resistance I\n§f• Permanent Slowness II (→ Slowness I 1min after mining iron ore)\n§f• 20% chance to double ore drop\n§7Weaknesses:\n§f• Fire/lava damage +150%\n§7Power:\n§f• Magnet: 75% negative knockback (victim pulled in) on melee hit\n§8§m-----------------------------------"
  ROLE_DESC_ICE: "§8§m-----------§b Ice §8§m-----------\n§bStrengths:\n§f• Permanent Speed I, Speed II near ice\n§f• Blizzard: arrow Slowness 15s + 20% trap target in snow\n§bWeaknesses:\n§f• Melee damage +15%\n§bPower:\n§f• §bIce §f: toggle — water under feet → ice 15s. On snow: right-click shoots infinite snowballs\n§8§m-----------------------------------"
  ROLE_DESC_POISON: "§8§m-----------§5 Poison §8§m-----------\n§5Strengths:\n§f• Poison immune\n§f• Permanent Thorns (even without armor): 20% damage taken reflected\n§f• Permanent Slowness I\n§f• Break spawner → 1 cave spider egg + 25% throwable poison potion\n§5Env:\n§f• Mining Fatigue I near dirt\n§8§m-----------------------------------"
  ROLE_DESC_FAIRY: "§8§m-----------§d Fairy §8§m-----------\n§dStrengths:\n§f• Permanent Weakness I\n§f• Speed I under sunlight\n§f• Sweet Kiss: arrows 50% Nausea 6s\n§dWeaknesses:\n§f• Slowness I out of sunlight\n§dPower:\n§f• §dEnderWand §f: throws enderpearls (45s cd)\n§dEnv:\n§f• Eat flower: +1 food, 5% Strength I 1min, 5% +1♥, 10% +0.5♥\n§8§m-----------------------------------"
  ROLE_DESC_GHOST: "§8§m-----------§5 Ghost §8§m-----------\n§5Strengths:\n§f• Permanent Slowness I\n§f• Invisible below Y=70\n§f• No PvE damage except fire/lava\n§f• 20% of arrows received miss\n§5Weaknesses:\n§f• Weakness I when exposed to sunlight\n§5Env:\n§f• Mining Fatigue I near dirt\n§8§m-----------------------------------"
  ROLE_DESC_PSYCHIC: "§8§m-----------§d Psychic §8§m-----------\n§dStrengths:\n§f• Arrows +15% damage\n§f• Sword hits +35% damage\n§f• -10% damage taken (arrows + melee)\n§dCommand:\n§f• §a/mindread <player> §f: read player inventory (5min cd)\n§dEnv:\n§f• On /mindread: if target within 100 blocks, they hear an anvil sound\n§8§m-----------------------------------"
  ROLE_DESC_DRAGON: "§8§m-----------§5 Dragon §8§m-----------\n§5Strengths:\n§f• Permanent Resistance I\n§f• Arrows hit players within 3 blocks of impact\n§f• Extreme Hills + 9+ hearts: permanent Resistance III\n§5Weaknesses:\n§f• Mining Fatigue I below 5 hearts\n§f• Slowness I above 5 hearts\n§5Env:\n§f• Drops increased (mobs, flint, iron, gold)\n§8§m-----------------------------------"
  ROLE_DESC_BUG: "§8§m-----------§2 Bug §8§m-----------\n§2Strengths:\n§f• Permanent Speed I\n§f• Speed II 5min after eating leaves\n§f• Arrows → cobwebs 75% radius 1\n§2Weaknesses:\n§f• Permanent Weakness II\n§f• Gapples heal 1.5 ♥\n§2Env:\n§f• Spiders and cave spiders don't attack\n§8§m-----------------------------------"
  ROLE_DESC_GROUND: "§8§m-----------§6 Ground §8§m-----------\n§6Strengths:\n§f• Permanent Slowness I\n§f• No fall damage\n§f• Arrows: prevent jump 2s in 3 blocks (Flying immune)\n§6Power:\n§f• §6Shovel §f: shoots snowball → 2-block dirt sphere (20s cd); at 10+ stacks dirt: bigger sphere, 10s cd\n§6Weaknesses:\n§f• Blindness in water\n§8§m-----------------------------------"
  ROLE_DESC_FIGHTING: "§8§m-----------§6 Fighting §8§m-----------\n§6Strengths:\n§f• Permanent Strength I\n§f• -15% bow damage\n§f• Close Combat (hunger < half): sword AOE radius 4\n§f• Ignores victims' Resistance in melee\n§6Power:\n§f• Detect: parry 30s cumulative → invincible until release. If stopped before 30s, cumul -5s. (5min cd)\n§8§m-----------------------------------"
  ROLE_DESC_FLYING: "§8§m-----------§b Flying §8§m-----------\n§bStrengths:\n§f• Arrows automatically Punch\n§f• No fall damage\n§f• Jump Boost VI 1s on simulated fall damage (if power ON)\n§bWeaknesses:\n§f• Slowness I below Y=40\n§f• +50% knockback received\n§bPower:\n§f• §bFeather §f: toggle permanent Speed I + Jump Boost III\n§8§m-----------------------------------"
  ROLE_DESC_FIRE: "§8§m-----------§c Fire §8§m-----------\n§cStrengths:\n§f• Permanent Fire Resistance\n§f• Arrows set ground on fire (15% target ignite)\n§f• Cutclean: ores auto-smelt, meat auto-cooks\n§cWeaknesses:\n§f• Nausea in water\n§f• 50% chance to get charcoal when breaking a log\n§cEnv:\n§f• On fire on grass: leaves a fire trail\n§8§m-----------------------------------"
