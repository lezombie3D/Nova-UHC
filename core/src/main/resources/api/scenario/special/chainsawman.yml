# ── Faille violette UNIQUE au centre du Nether (passage Enfer) ──
# Le joueur avec une Chair de Démon en main qui marche dans cette zone est TP à l'un des
# `enfer_spawns` aléatoirement. À la sortie d'Enfer, il revient au CENTRE de cette faille.
faille_enfer: { x: 0, y: 70, z: 0 }

# ── Points d'arrivée en Enfer (4 par défaut, choix aléatoire à chaque entrée) ──
enfer_spawns:
  0: { x: 100,  y: 70, z: 100 }
  1: { x: 100,  y: 70, z: -100 }
  2: { x: -100, y: 70, z: 100 }
  3: { x: -100, y: 70, z: -100 }

# ── Pochita : spawn en Enfer entre 20-45 min ──
pochita:
  spawn: { x: 100, y: 70, z: 100 }

# ── Makima : dimension dédiée + tirage aléatoire du villageois ──
makima:
  dimension_world: chainsawman_makima
  spawn: { x: 0, y: 70, z: 0 }
  # Le villageois Makima spawn aléatoirement parmi ces positions à l'annonce (45-55 min).
  villager_locations:
    0: { x: 10,  y: 70, z: 0 }
    1: { x: -10, y: 70, z: 0 }
    2: { x: 0,   y: 70, z: 10 }
    3: { x: 0,   y: 70, z: -10 }
    4: { x: 20,  y: 70, z: 20 }
    5: { x: -20, y: 70, z: -20 }

# ── Meetup : barrières débloquées dynamiquement (Cimetière à 8 alive, Ville à 4 alive) ──
# Chaque entrée = un cuboïde min/max dont les blocs seront mis en AIR au déblocage.
meetup:
  barriers:
    cimetiere:
      0:
        min: { x: -10, y: 60, z: 30 }
        max: { x:  10, y: 80, z: 30 }
    ville:
      0:
        min: { x: -10, y: 60, z: 60 }
        max: { x:  10, y: 80, z: 60 }
