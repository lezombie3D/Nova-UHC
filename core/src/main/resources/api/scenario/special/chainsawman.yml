# Chainsaw Man UHC — Configuration
#
# Toutes les positions sont configurables ici.
# Les valeurs HP/Sang/Cooldown des pacts se règlent via l'UI host (ScenariosUi),
# pas dans ce fichier.

# ── Autels Overworld (1 par démon Overworld, posé dans le monde arena) ──
altars:
  overworld:
    FOUET:       { x: 100,  y: 70, z: 100 }
    LANCEFLAMME: { x: 200,  y: 70, z: 200 }
    LONGSWORD:   { x: -100, y: 70, z: 100 }
    MUSCLE:      { x: -200, y: 70, z: 200 }
    PIERRE:      { x: 100,  y: 70, z: -100 }
    POISSON:     { x: 200,  y: 70, z: -200 }
    POULPE:      { x: -100, y: 70, z: -100 }
    RENARD:      { x: -200, y: 70, z: -200 }
    SERPENT:     { x: 300,  y: 70, z: 0 }
    TYPHON:      { x: -300, y: 70, z: 0 }

  # ── Autels Enfer ──
  # Système à 2 listes :
  #  - plates  : positions des plaques de pression (zone centrale Enfer où arrivent les joueurs)
  #              shuffle-mappées aux démons à chaque partie ; surplus de plaques = "wild" (TP démon random)
  #  - demons  : positions FIXES des NPC démons par nom (Ange toujours à ses coords, etc.)
  enfer:
    plates:
      0:  { x: 50,   y: 70, z: 0 }
      1:  { x: -50,  y: 70, z: 0 }
      2:  { x: 0,    y: 70, z: 50 }
      3:  { x: 0,    y: 70, z: -50 }
      4:  { x: 100,  y: 70, z: 100 }
      5:  { x: -100, y: 70, z: 100 }
      6:  { x: 100,  y: 70, z: -100 }
      7:  { x: -100, y: 70, z: -100 }
      8:  { x: 150,  y: 70, z: 0 }
      9:  { x: -150, y: 70, z: 0 }
      10: { x: 0,    y: 70, z: 150 }
      11: { x: 0,    y: 70, z: -150 }
      12: { x: 30,   y: 70, z: 30 }
      13: { x: -30,  y: 70, z: 30 }
      14: { x: 30,   y: 70, z: -30 }
      15: { x: -30,  y: 70, z: -30 }
      16: { x: 70,   y: 70, z: 0 }
      17: { x: -70,  y: 70, z: 0 }
      18: { x: 0,    y: 70, z: 70 }
      19: { x: 0,    y: 70, z: -70 }
      20: { x: 120,  y: 70, z: 50 }
      21: { x: -120, y: 70, z: 50 }
      22: { x: 120,  y: 70, z: -50 }
      23: { x: -120, y: 70, z: -50 }
      24: { x: 50,   y: 70, z: 120 }
      25: { x: -50,  y: 70, z: 120 }
      26: { x: 50,   y: 70, z: -120 }
      27: { x: -50,  y: 70, z: -120 }
      28: { x: 200,  y: 70, z: 0 }
      29: { x: -200, y: 70, z: 0 }
      30: { x: 0,    y: 70, z: 200 }
      31: { x: -0,   y: 70, z: -200 }
      32: { x: 80,   y: 70, z: 80 }
      33: { x: -80,  y: 70, z: 80 }
      34: { x: 80,   y: 70, z: -80 }
      35: { x: -80,  y: 70, z: -80 }
      36: { x: 25,   y: 70, z: 60 }
      37: { x: -25,  y: 70, z: 60 }
      38: { x: 25,   y: 70, z: -60 }
