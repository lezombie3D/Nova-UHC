  desc:
    ACID_RAIN: "Pioggia acida che infligge danni. Mettiti al riparo sotto i blocchi!"
    ARROW_SWITCH: "I giocatori colpiti da una freccia scambiano la propria posizion con il tiratore."
    BAT_ROULETTE: "Uccidere un pipistrello dà una mela d'oro, oppure ti uccide all'istante."
    FK: "Modalità di gioco a squadre con basi da difendere e obiettivi da catturare."
    BEST_PVE: "Guadagna un cuore ogni X minuti senza subire danni. Subire danni ti esclude, un'uccisione ti reintegra."
    BETA_ZOMBIE: "Gli zombi lasciano cadere da 0 a 2 piume invece del loro bottino abituale."
    BLACK_ARROW: "I minerali di carbone danno frecce invece di carbone."
    QUIVER: "Le frecce sono limitate per giocatore."
    BEATSANTA: "%santa_size% Babbo Natale contro %lutin_size% Folletto"
    BLIZZARD: "Tempeste di neve che rallentano e accecano. Resta vicino al fuoco!"
    BLOCK_RUSH: "Estrare un tipo di blocco per la prima volta dà %reward% lingotti d'oro."
    BLOOD_CYCLE: "Un tipo di minerale cambia periodicamente e infligge danni se estratto."
    BLOOD_DIAMONDS: "I giocatori perdono 1 cuore quando estraggono un diamante."
    BLOOD_LUST: "Ogni uccisione dà Velocità %speed_level% e Forza %strength_level% per %duration% secondi."
    BUFF_KILLER: "Uccidere un giocatore dà effetti di pozione benefici all'assassino."
    CAT_EYE: "Dà visione notturna permanente a tutti i giocatori."
    CHAT_PVP: "Quando inizia il PvP, la chat viene disattivata."
    COMPENSATION: "Alla morte di un giocatore, tutti i membri del team guadagnano %hearts% cuori."
    CRIPPLE: "Rende tutti i giocatori deboli per %duration% secondi."
    CUTCLEAN: "I minerali e le risorse animali vengono automaticamente fusi, senza bisogno di fornace."
    COBBLE_UNIFIED: "Granito, Andesite e Diorito (e le loro varianti lucidate) danno pietrisco."
    LAVALESS: "Vieta di riempire un secchio di lava o piazzare un secchio di lava."
    DEATH_EMERAULD: "Estrare un %block% infligge %damage% danni a un giocatore casuale."
    DEMOCRACY: "Vota per eliminare un giocatore ogni %minutes% minuti!"
    DOUBLE_ORE: "Raddoppia la quantità di minerali ottenuti durante l'estrazione, configurabile per ogni minerale."
    OBSI_BUFF: "Rompere l'ossidiana con un piccone dà Sollecitudine III e 2 ossidiana (configurabile)."
    FALLOUT: "Dopo un certo tempo, restare sopra Y=%level% infligge danni da radiazioni ai giocatori."
    FAST_FURNACE: "Le fornaci fondono un oggetto al secondo."
    FAST_MINER: "Fino al PvP: Velocità II, Fretta I (Fretta II sull'ossidiana) e Saturazione."
    FINAL_HEAL: "Cura tutti i giocatori in momenti specifici prima del PvP."
    FIRE_LESS: "Disattiva i danni da fuoco e lava."
    GAP_ROULETTE: "Le mele doro danno effetti casuali configurabili invece dei loro effetti normali."
    GENIE: "3 desideri per partita! Le opzioni dipendono dal numero di uccisioni."
    GLADIATOR: "Gli scontri 1v1 si svolgono in un'arena chiusa che compare automaticamente."
    GOLDEN_DROP: "I giocatori morti lasciano automaticamente una mela d'oro."
    GOLDEN_HEAD: "Le teste dei giocatori morti possono essere trasformate in mele d'oro speciali."
    GONE_FISH: "Scenario incentrato sulla pesca con ricompense speciali."
    HASTEY_ALPHA: "Versione estrema di HasteyBoy - Efficienza V e Indistruttibilità III su tutti gli attrezzi."
    HASTEY_BABIE: "Versione ridotta di HasteyBoy - solo Efficienza I sui attrezzi."
    HASTEY_BOY: "Tutti gli attrezzi creati ricevono automaticamente Efficienza III e Indistruttibilità I."
    HEATH_CHARITY: "Ogni X minuti, il giocatore con meno vita viene curato completamente."
    INFINITE_ENCHANTER: "I tavoli di incantamento non consumano lapislazzuli."
    INVENTORS: "Il primo a creare un oggetto viene annunciato a tutti."
    KING: "Un giocatore diventa Re e deve essere protetto dal suo team."
    LEGEND: "Scenario con 18 classi di leggenda uniche. Scegli la tua classe o verrà assegnata casualmente."
    LONG_SHOOT: "I colpi con l'arco oltre %distance% blocchi danno minerali; più lungo il tiro, meglio è."
    LOOT_CRATE: "Ogni giocatore riceve una cassa ogni %minutes% minuti, di tier 1 o tier 2."
    LUCKY_ORE: "%chance%% possibilità di ottenere un oggetto leggendario estraendo minerali."
    MAGNET: "I minerali che rompi finiscono direttamente nel tuo inventario."
    MEETUP: "Dà a tutti i giocatori lo stesso equipaggiamento."
    MYSTERY_TEAM: "§7Si formano squadre misteriose, scopri i tuoi compagni!"
    NINE_SLOT: "Solo la hotbar può essere usata. L'inventario principale è inaccessibile!"
    NINJA: "Diventi invisibile per %seconds% secondi dopo ogni uccisione!"
    NO_CLEAN_UP: "Uccidere un giocatore rende l'assassino immune al PvP per %seconds% secondi, salvo se attacca."
    NO_END: "Disattiva completamente l'accesso all'End."
    NO_FALL: "Impedisce i danni da caduta."
