  desc:
    ACID_RAIN: "Säurereigen, der Schaden verursacht. Suchen Sie Schutz unter Blöcken!"
    ARROW_SWITCH: "Spieler, die von einem Pfeil getroffen werden, tauschen die Position mit dem Schützen."
    BAT_ROULETTE: "Das Töten einer Fledermaus gibt einen goldenen Apfel oder tötet dich sofort."
    FK: "Teambasierter Spielmodus mit Basen zur Verteidigung und Eroberungszielen."
    BEST_PVE: "Erhalte alle X Minuten ein Herz, solange du unverletzt bleibst. Schaden entfernt dich, ein Kill bringt dich zurück."
    BETA_ZOMBIE: "Zombies lassen 0 bis 2 Federn statt ihrer üblichen Beute fallen."
    BLACK_ARROW: "Kohleerze lassen Pfeile fallen statt Kohle."
    QUIVER: "Pfeile sind pro Spieler begrenzt."
    BEATSANTA: "%santa_size% Santa Claus gegen %lutin_size% Zwerg"
    BLIZZARD: "Schneestürme, die verlangsamen und blenden. Bleiben Sie in der Nähe von Feuer!"
    BLOCK_RUSH: "Das erste Abbauen eines Blocktyps gibt %reward% Goldbarren."
    BLOOD_CYCLE: "Ein Erztyp ändert sich periodisch und fügt Schaden zu, wenn er abgebaut wird."
    BLOOD_DIAMONDS: "Spieler verlieren 1 Herz beim Abbauen eines Diamanten."
    BLOOD_LUST: "Jeder Kill gibt Schnelligkeit %speed_level% und Stärke %strength_level% für %duration% Sekunden."
    BUFF_KILLER: "Das Töten eines Spielers gibt dem Killer nützliche Trankeffekte."
    CAT_EYE: "Gibt allen Spielern permanente Nachtsicht."
    CHAT_PVP: "Wenn PvP beginnt, ist der Chat deaktiviert."
    COMPENSATION: "Beim Tod eines Spielers erhalten alle Teammitglieder %hearts% Herzen."
    CRIPPLE: "Macht alle Spieler schwach für %duration% Sekunden."
    CUTCLEAN: "Erze und Tierdrops werden automatisch geschmolzen, kein Ofen nötig."
    COBBLE_UNIFIED: "Granit, Andesit und Diorit (und ihre polierten Varianten) geben Bruchstein."
    LAVALESS: "Verbietet das Füllen eines Eimers mit Lava oder das Platzieren eines Lavaeimers."
    DEATH_EMERAULD: "Das Abbauen eines %block% fügt einem zufälligen Spieler %damage% Schaden zu."
    DEMOCRACY: "Stimmen Sie ab, um alle %minutes% Minuten einen Spieler zu eliminieren!"
    DOUBLE_ORE: "Verdoppelt die Menge der beim Abbauen erhaltenen Erze, konfigurierbar für jedes Erz."
    OBSI_BUFF: "Obsidian mit einer Spitzhacke zu brechen gibt Eile III und lässt 2 Obsidian fallen (konfigurierbar)."
    FALLOUT: "Nach einiger Zeit fügt das Verbleiben über Y=%level% den Spielern Strahlungsschaden zu."
    FAST_FURNACE: "Öfen schmelzen einen Gegenstand pro Sekunde."
    FAST_MINER: "Bis zum PvP: Schnelligkeit II, Eile I (Eile II auf Obsidian) und Sättigung."
    FINAL_HEAL: "Heilt alle Spieler zu bestimmten Zeiten vor dem PvP."
    FIRE_LESS: "Deaktiviert Feuer- und Lavaschaden."
    GAP_ROULETTE: "Goldene Äpfel geben konfigurierbare zufällige Effekte statt ihrer normalen Effekte."
    GENIE: "3 Wünsche pro Spiel! Optionen hängen von der Anzahl der Kills ab."
    GLADIATOR: "1v1-Kämpfe finden in einer geschlossenen Arena statt, die automatisch erscheint."
    GOLDEN_DROP: "Tote Spieler lassen automatisch einen goldenen Apfel fallen."
    GOLDEN_HEAD: "Köpfe toter Spieler können zu speziellen goldenen Äpfeln verarbeitet werden."
    GONE_FISH: "Angel-fokussiertes Szenario mit besonderen Belohnungen."
    HASTEY_ALPHA: "Extreme Version von HasteyBoy - Effizienz V und Haltbarkeit III auf allen Werkzeugen."
    HASTEY_BABIE: "Reduzierte Version von HasteyBoy - nur Effizienz I auf Werkzeugen."
    HASTEY_BOY: "Alle hergestellten Werkzeuge erhalten automatisch Effizienz III und Haltbarkeit I."
    HEATH_CHARITY: "Alle X Minuten wird der Spieler mit den wenigsten Herzen vollständig geheilt."
    INFINITE_ENCHANTER: "Verzaubertische verbrauchen kein Lapislazuli."
    INVENTORS: "Der Erste, der einen Gegenstand herstellt, wird allen angekündigt."
    KING: "Ein Spieler wird König und muss von seinem Team geschützt werden."
    LEGEND: "Szenario mit 18 einzigartigen Legendenklassen. Wählen Sie Ihre Klasse oder sie wird zugewiesen."
    LONG_SHOOT: "Bogenschüsse über %distance% Blöcke bringen Erz; je weiter, desto besser."
    LOOT_CRATE: "Jeder Spieler erhält alle %minutes% Minuten eine Kiste, Tier 1 oder Tier 2."
    LUCKY_ORE: "%chance%% Chance, einen legendären Gegenstand beim Abbauen von Erzen zu erhalten."
    MAGNET: "Erze, die du abbaust, landen direkt in deinem Inventar."
    MEETUP: "Gibt allen Spielern die gleiche Ausrüstung."
    MYSTERY_TEAM: "§7Geheimnisvolle Teams werden gebildet, entdecken Sie Ihre Teammitglieder!"
    NINE_SLOT: "Nur die Hotbar kann verwendet werden. Das Hauptinventar ist unzugänglich!"
    NINJA: "Werden Sie für %seconds% Sekunden nach jedem Kill unsichtbar!"
    NO_CLEAN_UP: "Das Töten eines Spielers macht den Killer für %seconds% Sekunden PvP-immun, sofern er nicht angreift."
