    CRIPPLE: "Hace que todos los jugadores sean débiles durante %duration% segundos."
    CUTCLEAN: "Los minerales y drops de animales se funden automáticamente, no se necesita horno."
    COBBLE_UNIFIED: "Granito, Andesita y Diorita (y sus variantes pulidas) sueltan adoquín."
    LAVALESS: "Prohibe llenar un cubo de lava o colocar un cubo de lava."
    DEATH_EMERAULD: "Minar un %block% inflige %damage% de daño a un jugador aleatorio."
    DEMOCRACY: "¡Vota para eliminar un jugador cada %minutes% minutos!"
