    FK: "Modo de juego por equipos con bases para defender y objetivos de captura."
    BEST_PVE: "Gana un corazón cada X minutos sin recibir daño. Recibir daño te saca, una baja te devuelve."
    BETA_ZOMBIE: "Los zombis sueltan de 0 a 2 plumas en lugar de su botín habitual."
    BLACK_ARROW: "Los minerales de carbón sueltan flechas en lugar de carbón."
    QUIVER: "Las flechas están limitadas por jugador."
    BEATSANTA: "%santa_size% Papá Noel contra %lutin_size% Duende"
