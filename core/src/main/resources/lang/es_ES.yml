    BLOOD_CYCLE: "Un tipo de mineral cambia periódicamente e inflige daño si se mina."
    BLOOD_DIAMONDS: "Los jugadores pierden 1 corazón al minar un diamante."
    BLOOD_LUST: "Cada muerte da Velocidad %speed_level% y Fuerza %strength_level% durante %duration% segundos."
    BUFF_KILLER: "Matar un jugador da efectos de poción beneficiosos al asesino."
    CAT_EYE: "Da visión nocturna permanente a todos los jugadores."
    CHAT_PVP: "Cuando comienza el PvP, el chat se deshabilita."
