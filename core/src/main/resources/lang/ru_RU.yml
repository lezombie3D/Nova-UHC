    BLACK_ARROW: "Угольные руды дропают стрелы вместо угля."
    QUIVER: "Стрелы ограничены на каждого игрока."
    BEATSANTA: "%santa_size% Санта-Клаус против %lutin_size% Гном"
    BLIZZARD: "Метели, замедляющие и ослепляющие. Держитесь рядом с огнём!"
    BLOCK_RUSH: "Добыча типа блока впервые даёт %reward% золотых слитков."
    BLOOD_CYCLE: "Тип руды периодически меняется и наносит урон при добыче."
    BLOOD_DIAMONDS: "Игроки теряют 1 сердце при добыче алмаза."
    BLOOD_LUST: "Каждое убийство даёт Скорость %speed_level% и Силу %strength_level% на %duration% секунд."
    BUFF_KILLER: "Убийство игрока даёт убийце благоприятные эффекты зелий."
    CAT_EYE: "Даёт всем игрокам постоянное ночное зрение."
    CHAT_PVP: "Когда PvP активируется, чат отключается."
    COMPENSATION: "После смерти игрока все члены команды получают %hearts% сердец."
    CRIPPLE: "Делает всех игроков слабыми на %duration% секунд."
    CUTCLEAN: "Руды и дропы животных автоматически переплавляются, печь не нужна."
    COBBLE_UNIFIED: "Гранит, андезит и диорит (и их полированные варианты) дропают булыжник."
    LAVALESS: "Запрещает набирать лаву в ведро или ставить ведро с лавой."
    DEATH_EMERAULD: "Добыча %block% наносит %damage% урона случайному игроку."
    DEMOCRACY: "Голосуйте за исключение игрока каждые %minutes% минут!"
