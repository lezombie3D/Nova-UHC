  desc:
    ACID_RAIN: "Acid rain that deals damage. Take shelter under blocks!"
    ARROW_SWITCH: "Players hit by an arrow swap positions with the shooter."
    BAT_ROULETTE: "Killing a bat drops a golden apple, or kills you outright."
    FK: "Team-based game mode with bases to defend and capture objectives."
    BEST_PVE: "Gain a heart every X minutes while undamaged. Taking damage removes you, a kill puts you back."
    BETA_ZOMBIE: "Zombies drop 0 to 2 feathers instead of their usual loot."
    BLACK_ARROW: "Coal ores drop arrows instead of coal."
    QUIVER: "Arrows are limited per player."
    BEATSANTA: "%santa_size% Santa Claus against %lutin_size% Drawf"
    BLIZZARD: "Snowstorms that slow and blind. Stay near fire!"
    BLOCK_RUSH: "Mining a block type for the first time gives %reward% gold ingot(s)."
    BLOOD_CYCLE: "An ore type changes periodically and deals damage if mined."
    BLOOD_DIAMONDS: "Players lose 1 heart when mining a diamond."
    BLOOD_LUST: "Each kill gives Speed %speed_level% and Strength %strength_level% for %duration% seconds."
    BUFF_KILLER: "Killing a player gives beneficial potion effects to the killer."
    CAT_EYE: "Gives permanent night vision to all players."
    CHAT_PVP: "When PvP starts, chat is disabled."
    COMPENSATION: "On a player's death, all team members gain %hearts% hearts."
    CRIPPLE: "Makes all players weak for %duration% seconds."
    CUTCLEAN: "Ores and animal drops are automatically smelted, no furnace needed."
    COBBLE_UNIFIED: "Granite, Andesite and Diorite (and their polished variants) drop cobblestone."
    LAVALESS: "Forbids filling a bucket with lava or placing a lava bucket."
    DEATH_EMERAULD: "Mining a %block% deals %damage% damage to a random player."
    DEMOCRACY: "Vote to eliminate a player every %minutes% minutes!"
    DOUBLE_ORE: "Doubles the amount of ores obtained when mining, configurable for each ore."
    OBSI_BUFF: "Breaking obsidian with a pickaxe gives Haste III and drops 2 obsidian (configurable)."
    FALLOUT: "After some time, staying above Y=%level% deals radiation damage to players."
    FAST_FURNACE: "Furnaces smelt one item per second."
    FAST_MINER: "Until PvP: Speed II, Haste I (Haste II on obsidian) and Saturation."
    FINAL_HEAL: "Heals all players at specific times before PvP."
    FIRE_LESS: "Disables fire and lava damage."
    GAP_ROULETTE: "Golden apples give configurable random effects instead of their normal effects."
    GENIE: "3 wishes per game! Options depend on the number of kills."
    GLADIATOR: "1v1 fights take place in a closed arena that appears automatically."
    GOLDEN_DROP: "Dead players automatically drop a golden apple."
    GOLDEN_HEAD: "Dead players' heads can be crafted into special golden apples."
    GONE_FISH: "Fishing-focused scenario with special rewards."
    HASTEY_ALPHA: "Extreme version of HasteyBoy - Efficiency V and Unbreaking III on all tools."
    HASTEY_BABIE: "Reduced version of HasteyBoy - only Efficiency I on tools."
    HASTEY_BOY: "All crafted tools automatically receive Efficiency III and Unbreaking I."
    HEATH_CHARITY: "Every X minutes, the lowest-health player is fully healed."
    INFINITE_ENCHANTER: "Enchanting tables don't consume lapis lazuli."
    INVENTORS: "The first player to craft an item is announced to everyone."
    KING: "A player becomes the King and must be protected by their team."
    LEGEND: "Scenario with 18 unique legend classes. Choose your class or it will be randomly assigned."
    LONG_SHOOT: "Bow shots over %distance% blocks reward ore, the longer the shot the better."
    LOOT_CRATE: "Each player receives a crate every %minutes% minutes, tier 1 or tier 2."
    LUCKY_ORE: "%chance%% chance to get a legendary item while mining ores."
    MAGNET: "Ores you mine go straight into your inventory."
    MEETUP: "Gives all players the same equipment."
    MYSTERY_TEAM: "§7Mysterious teams are formed, discover your teammates!"
    NINE_SLOT: "Only the hotbar can be used. The main inventory is inaccessible!"
    NINJA: "Become invisible for %seconds% seconds after each kill!"
    NO_CLEAN_UP: "Killing a player makes the killer immune to PvP for %seconds% seconds, unless they attack."
    NO_END: "Completely disables access to the End."
    NO_FALL: "Prevents fall damage."
    NO_FOOD: "Disables hunger - players never lose food."
    NO_HORSE: "Prevents riding horses."
    NO_NAME_TAG: "Hides player names above their heads."
    NO_NETHER: "Completely disables access to the Nether."
    NO_WOODEN_TOOL: "Automatically replaces wooden tools with iron tools."
    NETHERIBUS: "All players outside the Nether after %time% seconds will take %damage% damage per second."
    ORE_ROULETTE: "Each mined ore gives a random ore."
    ORE_SWAP: "Ores randomly change every 15 minutes."
    PARKOUR_MASTER: "Courses appear randomly. Completing them gives rewards!"
    POTENTIAL_PERMANENT: "10 hearts + 10 absorption. Damage permanently lowers your max health; eating a gap at full health converts absorption into permanent."
    RODLESS: "Prevents the use and crafting of fishing rods."
    RANDOMCRAFT: "§7Crafting recipes give random items."
    RANDOMDROP: "§7All mob and block drops are randomized."
    SAFE_MINER: "Below a given height, reduces mob damage and cancels fire and lava damage."
    SIMON_SAYS: "Follow Simon's commands or suffer penalties!"
    STARTER_TOOLS: "Gives basic tools to all players at the start of the game."
    SUPER_HEROS: "§eBecome a SuperHero with random powers!"
    TEAM_ARROW: "Arrows cannot hurt members of your own team."
    TEAM_INV: "Team members share their inventories."
    TPMEETUP: "Teleports all players to the center of the map after a given time"
    TIMBER: "Chop trees like a lumberjack - breaking one block fells the whole tree. Stops at PvP."
    TIME_BOMBE: "Dead players explode after a delay, creating a crater."
    TRANSMUTATION: "Transform resources through alchemy (crafting only)."
    VAMPIRE: "Recover 1 heart by killing a player, but burn in the sun without armor."
    WEAKEST_LINK: "Every X minutes the lowest-health players are eliminated. Nobody dies if all are equal."
    WEB_CAGE: "On death, the player is surrounded by a web cage."
    WOOL_TO_STRING: "One wool crafts into one string."
    XP_SANSUE: "Every X minutes each player loses an experience level, or health if they have none."
    SWITCH: "Every X minutes, a random player from each team is sent to another team (with their position)."
    TEAM_SWAPPER_CLASSIC: "Killing a player makes them join your team if they have lives left. No classes."
    TEAM_SWAPPER_V3: "Full TeamSwapper: classes (Maître/Ancien/Nouveau), Coup d'État, Cargaisons and lives system."
